app = 'scrambles'
primary_region = 'sin'

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "get"
    path = "/"
    timeout = "2s"
